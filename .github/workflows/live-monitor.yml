name: PDF Globe live site monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-monitor.yml"
      - "scripts/live_site_check.py"
      - "scripts/live_browser_smoke_test.js"
      - "static/style.css"
      - "static/app.js"
      - "static/index.html"
      - "static/en/index.html"
      - "static/saffha/index.html"
      - "static/api-config.js"
      - "static/image-compressor.js"
      - "static/image-compressor.html"
      - "static/en/image-compressor.html"
      - "static/office-converter.js"
      - "static/pdf-to-excel.html"
      - "static/pdf-to-powerpoint.html"
      - "static/en/pdf-to-excel.html"
      - "static/en/pdf-to-powerpoint.html"
      - "static/privacy.html"
      - "static/terms.html"

permissions:
  contents: read

concurrency:
  group: pdf-globe-live-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Check public pages and deployed API
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Monitor public website and API
        run: python scripts/live_site_check.py
      - name: Set up Node.js for live browser checks
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: npm install --no-save playwright@1.53.0 && npx playwright install --with-deps chromium
      - name: Check public tool cards in Chromium
        run: node scripts/live_browser_smoke_test.js
