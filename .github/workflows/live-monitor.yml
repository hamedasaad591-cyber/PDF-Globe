name: PDF Globe live site monitor

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/live-monitor.yml"
      - "scripts/live_site_check.py"

permissions:
  contents: read

concurrency:
  group: pdf-globe-live-monitor
  cancel-in-progress: true

jobs:
  monitor:
    name: Check public pages and deployed API
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Monitor public website and API
        run: python scripts/live_site_check.py
