name: PDF Globe code checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Install PDF and office system tools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-writer libreoffice-calc libreoffice-impress qpdf
      - name: Check Python syntax
        run: python -m py_compile main.py office_conversion.py image_conversion.py dicom_conversion.py dwg_conversion.py scripts/check_site.py scripts/smoke_test.py
      - name: Check JavaScript syntax
        run: node --check static/app.js && node --check static/unit-converter.js && node --check static/image-compressor.js && node --check static/office-converter.js && node --check scripts/browser_smoke_test.js
      - name: Check tool and page wiring
        run: python scripts/check_site.py
      - name: Smoke-test file generation end to end
        run: python scripts/smoke_test.py
      - name: Install Playwright and Chromium
        run: npm install --no-save playwright@1.53.0 && npx playwright install --with-deps chromium
      - name: Browser smoke-test client-side tools
        run: node scripts/browser_smoke_test.js
