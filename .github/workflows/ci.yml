name: PDF Globe code checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check Python syntax
        run: python -m py_compile main.py scripts/check_site.py
      - name: Check JavaScript syntax
        run: node --check static/app.js && node --check static/unit-converter.js && node --check static/image-compressor.js
      - name: Check tool and page wiring
        run: python scripts/check_site.py
